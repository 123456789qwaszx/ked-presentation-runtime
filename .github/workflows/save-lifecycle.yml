name: Save lifecycle
on:
  push:
    branches: [dev, main, saveCoordinator, server_DB_Test, learning/vn-play-analytics, refactor/offline-local-save]
  pull_request:
    paths:
      - 'Assets/Ked.Progression/**'
      - 'Assets/Ked.Presentation/Playback/Host/**'
      - 'Assets/Ked.Presentation/Playback/Memory/**'
      - 'Assets/Ked.Presentation/Playback/FeatureController/**'
      - 'Assets/Ked.Presentation/Playback/DialoguePresenter/**'
      - 'Assets/Samples/Scripts/Game/**'
      - 'Assets/Samples/Scripts/ProgressionHost/**'
      - 'tests/SaveLifecycle/**'
      - '.github/workflows/save-lifecycle.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  save-lifecycle:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            Assets/Ked.Progression
            Assets/Ked.Presentation/Playback
            Assets/Samples/Scripts/ProgressionHost
            Assets/Samples/Scripts/Game
            tests/SaveLifecycle
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Run save lifecycle regression harness
        run: dotnet run --project tests/SaveLifecycle/SaveLifecycle.csproj --configuration Release
